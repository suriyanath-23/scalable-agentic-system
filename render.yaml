services:
  - type: web
    name: scalable-agentic-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OFFLINE_MODE
        value: "true"
      - key: TOP_K_TOOLS
        value: "3"
      - key: MAX_RETRIES
        value: "2"
      - key: COOLDOWN_SECONDS
        value: "0"
      - key: GEMINI_API_KEY
        sync: false